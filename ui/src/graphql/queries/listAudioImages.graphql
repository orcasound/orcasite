query audioImages(
  $feedId: String!
  $startTime: DateTime!
  $endTime: DateTime!
  $limit: Int = 1000
  $offset: Int = 0
) {
  audioImages(
    feedId: $feedId
    startTime: $startTime
    endTime: $endTime
    filter: { status: { notEq: "FAILED" } }
    # A fixed order, so that fetching page after page neither repeats nor
    # skips an image.
    sort: [{ field: START_TIME, order: ASC }, { field: ID, order: ASC }]
    limit: $limit
    offset: $offset
  ) {
    hasNextPage
    results {
      ...AudioImageParts
    }
  }
}
