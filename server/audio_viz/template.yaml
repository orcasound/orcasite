AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  python3.12

  SAM Template for audio_viz

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 60

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:
  AudioVizFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
      - x86_64
      # CPU scales with memory (a full vCPU at 1769 MB). A cold render at 512 MB
      # peaked at 500 MB and did not finish inside the 60 s timeout.
      MemorySize: 1024
      # The function reads one segment and writes one image. The buckets are
      # those orcasite's environments use: production and staging read from
      # audio-orcasound-net and write to audio-deriv-orcasound-net; dev also
      # reads dev-streaming-orcasound-net and writes dev-audio-viz.
      Policies:
      - AWSLambdaBasicExecutionRole # CloudWatch logs
      - Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              - arn:aws:s3:::audio-orcasound-net/*
              - arn:aws:s3:::dev-streaming-orcasound-net/*
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              - arn:aws:s3:::audio-deriv-orcasound-net/*
              - arn:aws:s3:::dev-audio-viz/*
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./core
      DockerTag: python3.14-v1

Outputs:
  AudioVizFunction:
    Description: AudioViz Lambda Function ARN
    Value: !GetAtt AudioVizFunction.Arn
  AudioVizFunctionIamRole:
    Description: Implicit IAM Role created for AudioViz function
    Value: !GetAtt AudioVizFunctionRole.Arn
